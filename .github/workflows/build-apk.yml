name: Compiler Kuça en .apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accepter les licences du SDK Android (déjà préinstallé)
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Autoriser l'exécution de Gradle
        run: chmod +x android/gradlew

      - name: Compiler l'application (.apk)
        run: cd android && ./gradlew assembleDebug

      - name: Mettre le .apk à disposition au téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: Kuca-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
